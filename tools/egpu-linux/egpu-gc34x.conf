# ASUS GC34X eGPU stability on Linux (see /usr/local/sbin/egpu-bar1).
# Keep the USB4 link out of CLx low-power states.
options thunderbolt clx=0
# Cap the GPU PCIe link at Gen3 (Gen4/5/6 disabled) and lock it at driver load.
# A TB4 40G tunnel carries about Gen3 x4 anyway.
options nvidia NVreg_RegistryDwords="RMPcieLinkSpeed=0x800002a0"
